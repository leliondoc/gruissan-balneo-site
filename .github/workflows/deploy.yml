name: Deploy WordPress Balneo V2

on:
  push:
    branches:
      - master
    paths:
      - "wordpress-theme/balneo-v2/**"
      - "wordpress-plugin/balneo-media/**"
      - ".github/workflows/deploy.yml"
      - "scripts/deploy-sftp.js"
      - "scripts/test-deploy-sftp.js"
      - "package.json"
      - "package-lock.json"
      - "composer.json"
      - "composer.lock"
      - "phpcs.xml.dist"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit ou branche a publier
        required: true
        default: master

# Le jeton GitHub ne sert qu'a lire le depot.
permissions:
  contents: read

# Une seule publication SFTP a la fois.
concurrency:
  group: deploy-balneo-wordpress
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Installer les dependances de validation
        timeout-minutes: 4
        run: npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000

      - name: Installer les controles WordPress
        timeout-minutes: 3
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verifier la cle SFTP sans identifiants
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_HOST_KEY_SHA256: ${{ secrets.SFTP_HOST_KEY_SHA256 }}
        run: node scripts/deploy-sftp.js --check-host

      - name: Verifier les vulnerabilites des dependances
        timeout-minutes: 3
        run: |
          npm audit --audit-level=low --fetch-retries=1 --fetch-timeout=60000
          composer audit --no-interaction

      - name: Valider le theme et le plugin
        run: |
          node --check build-wordpress-theme.js
          node --check scripts/audit-wordpress-theme.js
          node --check scripts/build-pot.js
          npm run check:links
          npm run check:analytics
          npm run check:horaires
          npm run check:planning-admin
          npm run check:phpcs
          npm run check:assets
          npm run check:deploy
          npm run audit:wordpress
          find wordpress-theme/balneo-v2 wordpress-plugin/balneo-media -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Publier le theme et le plugin medias via SFTP
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          SFTP_HOST_KEY_SHA256: ${{ secrets.SFTP_HOST_KEY_SHA256 }}
        run: node scripts/deploy-sftp.js
