name: Deploy WordPress Balneo V2

on:
  push:
    branches:
      - master
    paths:
      - "wordpress-theme/balneo-v2/**"
      - "wordpress-plugin/balneo-media/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit ou branche a publier
        required: true
        default: master

# Le jeton GitHub ne sert qu'a lire le depot.
permissions:
  contents: read

# Une seule synchronisation FTP a la fois afin de proteger son fichier d'etat.
concurrency:
  group: deploy-balneo-wordpress
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Installer les dependances de validation
        run: npm ci --ignore-scripts

      - name: Valider le theme et le plugin
        run: |
          node --check build-wordpress-theme.js
          node --check scripts/audit-wordpress-theme.js
          node --check scripts/build-pot.js
          npm run check:links
          npm run audit:wordpress
          find wordpress-theme/balneo-v2 wordpress-plugin/balneo-media -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Publier le theme WordPress via FTP
        uses: SamKirkland/FTP-Deploy-Action@cfcb39fa3cdf2ff98ac1a7fbfa539d20526d474d # 4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ format('{0}wp-content/themes/balneo-v2/', secrets.FTP_SERVER_DIR) }}
          local-dir: ./wordpress-theme/balneo-v2/
          state-name: .ftp-deploy-sync-state-balneo-theme.json
          dangerous-clean-slate: false

      - name: Publier le plugin medias via FTP
        uses: SamKirkland/FTP-Deploy-Action@cfcb39fa3cdf2ff98ac1a7fbfa539d20526d474d # 4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ format('{0}wp-content/plugins/balneo-media/', secrets.FTP_SERVER_DIR) }}
          local-dir: ./wordpress-plugin/balneo-media/
          state-name: .ftp-deploy-sync-state-balneo-media.json
          dangerous-clean-slate: false
